# Deploy live Firebase Hosting whenever code is merged into main.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC7clN701_fmTPL3X6RtMK4Q2Gf0o7VYpI
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: budgeting-app-57618.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: budgeting-app-57618
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: budgeting-app-57618.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "896852376727"
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:896852376727:web:2f266f770f7570473f3dd2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run export:web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETING_APP_57618 }}
          channelId: live
          projectId: budgeting-app-57618
