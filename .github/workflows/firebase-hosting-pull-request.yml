# Build a Firebase Hosting preview for each pull request targeting main.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyC7clN701_fmTPL3X6RtMK4Q2Gf0o7VYpI
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: budgeting-app-57618.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: budgeting-app-57618
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: budgeting-app-57618.firebasestorage.app
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "896852376727"
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:896852376727:web:2f266f770f7570473f3dd2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run export:web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETING_APP_57618 }}
          projectId: budgeting-app-57618
